pre-commit:
  jobs:
    - name: lint
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx}"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx,json,jsonc,css}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
