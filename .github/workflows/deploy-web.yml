name: Deploy Web

# Deploys apps/web to Cloudflare Workers on push, mirroring the old Vercel git
# flow: dev -> staging env (next.umamin.link), main -> production env. The job
# gates on the full test suite (incl. the workerd pool, which the turbo test
# task deliberately excludes) because pushes to dev don't run ci.yml.
on:
  push:
    branches: ["dev", "main"]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Queue, never cancel: a deploy must not be killed mid-upload.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test and deploy
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Same secret NAMES in both environments — the environment decides which
    # protection rules apply (wrangler.jsonc decides the target Worker).
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d641de017cab0d57c6b4610f69607ce6

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run workerd tests
        run: pnpm --filter=web test:workers

      - name: Deploy staging
        if: github.ref_name != 'main'
        run: pnpm --filter=web deploy

      - name: Deploy production
        if: github.ref_name == 'main'
        run: pnpm --filter=web deploy:production
