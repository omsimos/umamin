packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: replaces onlyBuiltDependencies — only these packages may run
# install scripts. esbuild/sharp scripts were already skipped under v10
# (both ship prebuilt binaries via optionalDependencies); v11 just demands
# the decision be explicit. @posthog/cli is the exception that NEEDS its script:
# the Rust binary is downloaded by postinstall, and the source-map upload has
# nothing to spawn without it. core-js only prints a funding banner.
allowBuilds:
  '@posthog/cli': true
  core-js: false
  esbuild: false
  lefthook: true
  sharp: false
  workerd: true

# Install both libc variants of native packages on Linux. pnpm 12 detects the
# libc itself and installs only the glibc binaries on Vercel's build image, but
# libsql's own runtime detection there reports musl, so Next's file tracing
# asks for @libsql/linux-x64-musl and the org deploy fails on the missing path.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [current, musl]
